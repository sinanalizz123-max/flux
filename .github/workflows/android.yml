name: Build Flux APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # REMOVED: chmod +x gradlew (File doesn't exist yet)

    - name: Build with Gradle
      # CHANGED: Use 'gradle' directly instead of './gradlew'
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: Flux-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
